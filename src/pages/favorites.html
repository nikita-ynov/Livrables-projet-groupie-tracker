<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YNFT - Favorites</title>
    <link rel="stylesheet" href="static/css/styles.css">
</head>

<body>
    <header>
        <div class="container">
            <a href="/" class="logo">
                <img src="static/assets/logo.svg" alt=""> YNFT
            </a>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/collections">Collections</a></li>
                <li><a href="/favorites" class="selected">Favorites</a></li>
                <li><a href="/about">About</a></li>
                <li><button class="login__btn">Connect</button></li>
            </ul>
        </div>
    </header>

    <main>
        <div class="collections fav container">
            <h1>My Favorites</h1>
            
            <div class="items">
                {{if not .NFTs}}
                    <div style="width:100%; text-align:center; padding: 50px;">
                        <p>No favorites yet.</p>
                        <a href="/collections" class="main__btn" style="display:inline-block; margin-top:10px;">Browse Collections</a>
                    </div>
                {{end}}

                {{range .NFTs}}
                <a href="/item/{{.Contract.Address}}/{{.Id.TokenId}}" class="item">
                    {{if .Media}}
                        <img src="{{ (index .Media 0).Gateway }}" alt="{{.Title}}" onerror="this.src='static/assets/placeholder.png'">
                    {{else}}
                        <img src="static/assets/placeholder.png" alt="No image">
                    {{end}}
                    
                    <p>
                        {{if .Title}}
                            {{.Title}}
                        {{else}}
                            Item #{{.Id.TokenId}}
                        {{end}}
                    </p>
                </a>
                {{end}}
            </div>
        </div>
    </main>
</body>
</html>
